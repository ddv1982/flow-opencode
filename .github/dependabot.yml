version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Deliberately pinned; bump manually alongside a tested OpenCode
      # version (see docs/maintainer-contract.md "Dependencies").
      - dependency-name: zod
      - dependency-name: "@opencode-ai/plugin"
