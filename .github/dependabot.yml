version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Deliberately pinned; bump manually with package.json and the focused
      # compatibility checks described in docs/development.md.
      - dependency-name: zod
      - dependency-name: "@opencode-ai/plugin"
