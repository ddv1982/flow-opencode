name: Harness Promotion Gate

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Candidate harness profile to evaluate for promotion
        required: true
        type: choice
        options:
          - standard
          - assurance

permissions:
  contents: read

# Promotion is manual while the sanitized control fixture has no qualifying
# same-corpus candidate. Do not add push, pull_request, schedule, or tag triggers
# until an independently reviewed candidate passes this exact gate.
jobs:
  evaluate-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Evaluate requested candidate gate
        run: bun run harness:report -- --json --require "${{ inputs.variant }}"
