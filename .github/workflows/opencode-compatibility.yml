name: OpenCode Compatibility

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the latest OpenCode 2 release
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const result = JSON.parse(execFileSync('npm', ['view', '@opencode/cli@2', 'version', '--json'], { encoding: 'utf8' }));
          const versions = (Array.isArray(result) ? result : [result])
            .filter((version) => /^2\.\d+\.\d+$/.test(version))
            .sort((a, b) => {
              const left = a.split('.').map(Number);
              const right = b.split('.').map(Number);
              return left[1] - right[1] || left[2] - right[2];
            });
          const version = versions.at(-1);
          if (!version) throw new Error('No stable OpenCode 2 release resolved.');
          appendFileSync(process.env.GITHUB_ENV, `FLOW_OPENCODE_SMOKE_VERSION=${version}\n`);
          console.log(`Compatibility host: @opencode/cli@${version}`);
          JS

      - name: Run live OpenCode smoke
        run: bun run smoke:live
