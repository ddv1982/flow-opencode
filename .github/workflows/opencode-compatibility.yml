name: OpenCode Compatibility

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# This non-blocking scheduled signal catches upcoming OpenCode drift without
# making an unreviewed host release part of the reproducible v6 build.
jobs:
  latest-opencode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live OpenCode smoke
        env:
          FLOW_OPENCODE_SMOKE_VERSION: latest
        run: bun run smoke:live
