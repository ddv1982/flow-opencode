name: Release

on:
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Recover the verified 9.1.0 release without moving its tag
        required: true
        type: choice
        options:
          - v9.1.0
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
      recovery: ${{ steps.resolve.outputs.recovery }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.recover_tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" || "${RECOVERY_TAG}" != "v9.1.0" || "${RECOVERY_TAG}" != "${tag}" ]]; then
              echo "::error::Release recovery requires main and the exact v9.1.0 tag."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "recovery=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::Release tag/version mismatch: tag=${GITHUB_REF_NAME}, package.json=${version}."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "recovery=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "recovery=false" >> "$GITHUB_OUTPUT"
          fi

  verify-main-and-tag:
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLOW_RELEASE_RECOVERY_TAG: ${{ needs.decide.outputs.recovery == 'true' && needs.decide.outputs.tag || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Run deterministic checks
        timeout-minutes: 10
        run: bun run check

      - name: Rebuild release candidate
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .
          if [[ -n "${FLOW_RELEASE_RECOVERY_TAG}" ]]; then
            bun run scripts/restore-exact-release-artifact.ts \
              opencode-plugin-flow-9.1.0.tgz \
              evals/qualification/bundles/qb1-86bbc934222c2715d315521ff5041edc718eba6492ff679db50a6d494fc1bd6d/objects/sha256-0b7f7a66bf1910b5d0da3a235f891d532b4aa352a2dbd25e398325c18e051b24 \
              sha256:0b7f7a66bf1910b5d0da3a235f891d532b4aa352a2dbd25e398325c18e051b24
          fi

      - name: Report release evidence readiness without publishing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run release:metadata -- --artifact "$tarball"
          if [[ -n "${FLOW_RELEASE_RECOVERY_TAG}" ]]; then
            bun run release:metadata -- --tag "$FLOW_RELEASE_RECOVERY_TAG" --artifact "$tarball" --canary evals/canary/9.1.0.json
            bun run eval:canary -- verify --artifact "$tarball" --mode strict
          else
            bun run eval:canary -- verify --artifact "$tarball" --mode dry-run
          fi

  release:
    needs: [decide, verify-main-and-tag]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLOW_RELEASE_RECOVERY_TAG: ${{ needs.decide.outputs.recovery == 'true' && needs.decide.outputs.tag || '' }}
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm trusted publishing support
        timeout-minutes: 5
        run: |
          npm install --global npm@11.18.0
          node --version
          npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Run checks
        timeout-minutes: 10
        run: bun run check

      - name: Run pinned live OpenCode smoke
        timeout-minutes: 5
        run: bun run smoke:live

      - name: Replay recorded decisions without models
        run: bun run replay

      - name: Prepare package
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .
          if [[ -n "${FLOW_RELEASE_RECOVERY_TAG}" ]]; then
            bun run scripts/restore-exact-release-artifact.ts \
              opencode-plugin-flow-9.1.0.tgz \
              evals/qualification/bundles/qb1-86bbc934222c2715d315521ff5041edc718eba6492ff679db50a6d494fc1bd6d/objects/sha256-0b7f7a66bf1910b5d0da3a235f891d532b4aa352a2dbd25e398325c18e051b24 \
              sha256:0b7f7a66bf1910b5d0da3a235f891d532b4aa352a2dbd25e398325c18e051b24
          fi

      - name: Restore release record from this workflow run
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq 'if .total_count > 100 then error("Artifact inventory exceeds limit") else [.artifacts[] | select(.name == "release-state" and .expired == false)] | length end')"
          if [ "$count" = 1 ]; then
            gh run download "$GITHUB_RUN_ID" --name release-state --dir .release-state
            echo "restored=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" != 0 ]; then
            echo "::error::Ambiguous release-state artifact."
            exit 1
          elif [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then
            echo "::error::Prior release record is unavailable. Inspect the previous attempt before creating a new record."
            exit 1
          fi

      - name: Verify selected release evidence
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          evidence=(--canary "evals/canary/${version}.json")
          if [ -f "evals/qualification/features/${version}.json" ]; then
            if [ -f "evals/qualification/patches/${version}.json" ]; then
              echo "::error::Conflicting offline qualification records."
              exit 1
            fi
            evidence=(--feature "evals/qualification/features/${version}.json")
          elif [ -f "evals/qualification/patches/${version}.json" ]; then
            evidence=(--patch "evals/qualification/patches/${version}.json")
          fi
          commit="${GITHUB_SHA}"
          if [[ -n "${FLOW_RELEASE_RECOVERY_TAG}" ]]; then
            commit="$(git rev-parse "${FLOW_RELEASE_RECOVERY_TAG}^{commit}")"
          fi
          bun run scripts/release.ts init .release-state \
            --artifact "$tarball" \
            "${evidence[@]}" \
            --commit "$commit"

      - name: Persist release record before publication
        if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-state
          path: .release-state/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Resume verified publication
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/release.ts resume .release-state

      - name: Report release state
        if: always()
        run: bun run scripts/release.ts status .release-state
