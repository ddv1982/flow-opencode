name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Release tag/version mismatch: tag=${tag}, package.json=${package_version}" >&2
            exit 1
          fi

          if ! grep -Eq "^##[[:space:]]+\\[?${version}\\]?" CHANGELOG.md; then
            echo "Missing changelog heading for version ${version}" >&2
            exit 1
          fi

          mapfile -t readme_versions < <(grep -Eo 'opencode-plugin-flow@[0-9]+\.[0-9]+\.[0-9]+' README.md | sed 's/.*@//' | sort -u)
          if [[ "${#readme_versions[@]}" -eq 0 ]]; then
            echo "README.md does not contain version-pinned opencode-plugin-flow install snippets" >&2
            exit 1
          fi
          for readme_version in "${readme_versions[@]}"; do
            if [[ "${readme_version}" != "${package_version}" ]]; then
              echo "README.md pins opencode-plugin-flow@${readme_version}, expected ${package_version}" >&2
              exit 1
            fi
          done

          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ ("^## \\[?" version "\\]?") { in_section = 1 }
            in_section {
              if ($0 ~ /^## / && $0 !~ ("^## \\[?" version "\\]?")) exit
              print
            }
          ' CHANGELOG.md > release-notes.md

      - name: Run checks
        run: bun run check

      - name: Run package smoke
        run: bun run package:smoke

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          shasum -a 256 "$tarball" > "${tarball}.sha256"

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "NPM_TOKEN secret is not configured; cannot publish to npm." >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > "$HOME/.npmrc"
          npm publish opencode-plugin-flow-*.tgz --access public

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="$(ls opencode-plugin-flow-*.tgz)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$tarball" "${tarball}.sha256" --clobber
          else
            gh release create "$tag" "$tarball" "${tarball}.sha256" --title "$tag" --notes-file release-notes.md
          fi
