name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm trusted publishing support
        run: |
          npm install --global npm@11
          node --version
          npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag and changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Release tag/version mismatch: tag=${tag}, package.json=${package_version}" >&2
            exit 1
          fi

          if ! grep -Eq "^##[[:space:]]+\\[?${version}\\]?" CHANGELOG.md; then
            echo "Missing changelog heading for version ${version}" >&2
            exit 1
          fi

          mapfile -t readme_versions < <(grep -Eo 'opencode-plugin-flow@[0-9]+\.[0-9]+\.[0-9]+' README.md docs/troubleshooting.md | sed 's/.*@//' | sort -u)
          if [[ "${#readme_versions[@]}" -eq 0 ]]; then
            echo "README.md does not contain version-pinned opencode-plugin-flow install snippets" >&2
            exit 1
          fi
          for readme_version in "${readme_versions[@]}"; do
            if [[ "${readme_version}" != "${package_version}" ]]; then
              echo "Docs pin opencode-plugin-flow@${readme_version}, expected ${package_version}" >&2
              exit 1
            fi
          done

          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ ("^## \\[?" version "\\]?") { in_section = 1 }
            in_section {
              if ($0 ~ /^## / && $0 !~ ("^## \\[?" version "\\]?")) exit
              print
            }
          ' CHANGELOG.md > release-notes.md

      - name: Run checks
        run: bun run check

      - name: Run package smoke
        run: bun run package:smoke

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          shasum -a 256 "$tarball" > "${tarball}.sha256"

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          npm publish opencode-plugin-flow-*.tgz --access public

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="$(ls opencode-plugin-flow-*.tgz)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$tarball" "${tarball}.sha256" --clobber
          else
            gh release create "$tag" "$tarball" "${tarball}.sha256" --title "$tag" --notes-file release-notes.md
          fi
