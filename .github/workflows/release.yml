name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm trusted publishing support
        run: |
          npm install --global npm@11.18.0
          node --version
          npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release tag and changelog
        run: bun run release:metadata -- --tag "${GITHUB_REF_NAME}" --notes-file release-notes.md

      - name: Run checks
        run: bun run check

      - name: Run package smoke
        run: bun run package:smoke

      - name: Run pinned live OpenCode smoke
        run: bun run smoke:live

      - name: Prepare package
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          shasum -a 256 "$tarball" > "${tarball}.sha256"

      - name: Publish to npm
        shell: bash
        run: |
          set -euo pipefail
          npm publish opencode-plugin-flow-*.tgz --access public

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="$(ls opencode-plugin-flow-*.tgz)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file release-notes.md
            gh release upload "$tag" "$tarball" "${tarball}.sha256" --clobber
          else
            gh release create "$tag" "$tarball" "${tarball}.sha256" --title "$tag" --notes-file release-notes.md
          fi
