name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "${tag}" ]]; then
              echo "::error::Release tag/version mismatch: tag=${GITHUB_REF_NAME}, package.json=${version}."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  verify-main-and-tag:
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Run deterministic checks
        timeout-minutes: 10
        run: bun run check

      - name: Rebuild release candidate
        timeout-minutes: 2
        run: bun pm pack --destination .

      - name: Report release evidence readiness without publishing
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run release:metadata -- --artifact "$tarball"
          bun run eval:canary -- verify --artifact "$tarball" --mode dry-run

  release:
    needs: [decide, verify-main-and-tag]
    if: needs.decide.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Set up npm trusted publishing support
        timeout-minutes: 5
        run: |
          npm install --global npm@11.18.0
          node --version
          npm --version

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Validate release tag and changelog
        timeout-minutes: 2
        run: bun run release:metadata -- --tag "${{ needs.decide.outputs.tag }}" --notes-file release-notes.md

      - name: Run checks
        timeout-minutes: 10
        run: bun run check

      - name: Run pinned live OpenCode smoke
        timeout-minutes: 5
        run: bun run smoke:live

      - name: Prepare package
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bun pm pack --destination .

      - name: Verify independently regraded qualification bundle and fresh canary
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run release:metadata -- \
            --tag "${{ needs.decide.outputs.tag }}" \
            --notes-file release-notes.md \
            --artifact "$tarball" \
            --canary "evals/canary/${version}.json"
          shasum -a 256 "$tarball" > "${tarball}.sha256"

      - name: Prepare exact GitHub release draft
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.decide.outputs.tag }}"
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run scripts/release-publish.ts github-prepare \
            --tag "$tag" \
            --commit "${GITHUB_SHA}" \
            --notes release-notes.md \
            --asset "$tarball" \
            --asset "${tarball}.sha256"

      - name: Publish to npm after a current-main proof
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run scripts/release-publish.ts npm \
            --artifact "$tarball" \
            --tag "${{ needs.decide.outputs.tag }}"

      - name: Publish the exact GitHub release draft
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.decide.outputs.tag }}"
          tarball="$(ls opencode-plugin-flow-*.tgz)"
          bun run scripts/release-publish.ts github-publish \
            --tag "$tag" \
            --commit "${GITHUB_SHA}" \
            --notes release-notes.md \
            --asset "$tarball" \
            --asset "${tarball}.sha256"
