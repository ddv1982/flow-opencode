name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflow syntax
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspaces" -w /workspaces rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high-severity dependency advisories
        run: bun audit --audit-level=high

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      # Free and offline: the committed cassettes replay recorded model decisions
      # against this build's runtime, so a change that refuses a sequence a real model
      # already performed fails here rather than at the next paid matrix.
      - name: Replay recorded model decisions
        run: bun run replay

      - name: Rebuild qualified 9.4.0 artifact without providers
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "9.4.0" || ! -f "evals/qualification/archives/${version}.json" ]]; then
            echo "No qualified 9.4.0 artifact rebuild declared."
            exit 0
          fi
          archive_ci_root="$(mktemp -d)"
          trap 'git worktree remove "$archive_ci_root/source"; rm -rf "$archive_ci_root"' EXIT
          git worktree add --quiet --detach "$archive_ci_root/source" "refs/tags/v${version}"
          bun run scripts/prepare-qualified-release-940.ts --repository-root "$archive_ci_root/source" --out "$archive_ci_root/opencode-plugin-flow-9.4.0.tgz"

      - name: Regrade retained qualification archive without providers
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ ! -f "evals/qualification/archives/${version}.json" ]; then
            echo "No retained qualification archive declared."
            exit 0
          fi
          if git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            qualification_ci_root="$(mktemp -d)"
            trap 'git -C "$GITHUB_WORKSPACE" worktree remove "$qualification_ci_root/source"; rm -rf "$qualification_ci_root"' EXIT
            git worktree add --quiet --detach "$qualification_ci_root/source" "refs/tags/v${version}"
            cd "$qualification_ci_root/source"
            bun install --frozen-lockfile
          fi
          bun -e '
            import { readFile } from "node:fs/promises";
            import { parseCanaryRecord } from "./scripts/eval-canary.ts";
            import { assertQualificationBundle } from "./scripts/release-metadata.ts";
            const { version } = JSON.parse(await readFile("package.json", "utf8"));
            const parsed = parseCanaryRecord(JSON.parse(await readFile("evals/canary/" + version + ".json", "utf8")));
            if (!parsed.ok) throw new Error(parsed.issues.join("; "));
            await assertQualificationBundle({ version, expectedCanarySha256: parsed.value.recordSha256, now: new Date(parsed.value.recordedAt) });
            console.log("RETAINED: archive regraded at its recorded canary time; no current-release freshness claim.");
          '

  platform-persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run platform filesystem checks
        run: bun test tests/workspace-persistence.test.ts tests/source-identity.test.ts tests/flow-leadership.test.ts tests/test-results.test.ts tests/validation-capture.test.ts

  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live OpenCode smoke
        run: bun run smoke:live

  patch-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Verify offline candidate when declared
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          record="evals/qualification/patches/${version}.json"
          mode=--patch
          if [ -f "evals/qualification/features/${version}.json" ]; then
            if [ -f "$record" ]; then
              echo "::error::Conflicting offline qualification records."
              exit 1
            fi
            record="evals/qualification/features/${version}.json"
            mode=--feature
          fi
          if [ ! -f "$record" ]; then
            echo "No offline qualification declared; full qualification remains required."
            exit 0
          fi
          if [ -n "$BASE_SHA" ]; then
            old_version="$(git show "$BASE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
            if [ "$old_version" = "$version" ] && git diff --quiet "$BASE_SHA" HEAD -- "$record"; then
              echo "No new offline release declaration."
              exit 0
            fi
          fi
          bun install --frozen-lockfile
          bun run build
          bun run replay
          bun run smoke:live
          mkdir -p .release-artifacts/patch-ci
          bun pm pack --destination .release-artifacts/patch-ci
          bun scripts/release.ts init .release-artifacts/patch-ci/record \
            --artifact ".release-artifacts/patch-ci/opencode-plugin-flow-${version}.tgz" \
            "$mode" "$record" --commit "$GITHUB_SHA"
