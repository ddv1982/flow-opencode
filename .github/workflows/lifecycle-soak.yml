name: Lifecycle Soak

on:
  schedule:
    - cron: '43 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-lifecycle-soak:
    strategy:
      fail-fast: false
      matrix:
        seed-start: [1009, 2003, 4001, 8009]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic lifecycle soak
        env:
          FLOW_LIFECYCLE_SEED_START: ${{ matrix.seed-start }}
          FLOW_LIFECYCLE_SEED_COUNT: 128
          FLOW_LIFECYCLE_STEP_COUNT: 64
        run: bun test tests/lifecycle-invariant-sequences.test.ts
